name: Deploy FitBase

# Push-to-deploy for FitBase. It runs as a webface.cloud `custom`-template app,
# so the platform's git webhook intentionally skips it (it can't cross-compile a
# per-app Go binary) — this workflow is that missing CI: build the linux binary
# and ship it via scripts/deploy.sh, the same path used locally.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# never let two deploys race onto the droplet
concurrency:
  group: deploy-fitbase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # fitbase and webface-cloud must be siblings so server/go.mod's
      # `replace webface.cloud/platform => ../../webface-cloud` resolves.
      - name: Checkout fitbase
        uses: actions/checkout@v4
        with:
          path: fitbase

      - name: Checkout webface-cloud (platform — build dependency)
        uses: actions/checkout@v4
        with:
          repository: webfacemedia-inc/webface-cloud
          ssh-key: ${{ secrets.WEBFACE_CLOUD_DEPLOY_KEY }}
          path: webface-cloud

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: fitbase/server/go.mod
          cache-dependency-path: fitbase/server/go.sum

      - name: Configure SSH to the droplet
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H 137.184.160.83 >> ~/.ssh/known_hosts 2>/dev/null

      # Reuses the exact local deploy path: cross-compile linux/amd64, scp the
      # binary, restart the systemd unit, then sync public/ into pb_public
      # (cache-busting index.html with the commit sha).
      - name: Build & deploy
        working-directory: fitbase
        run: bash scripts/deploy.sh

      # Tell the control plane this deploy happened.
      #
      # These pipelines scp a binary and restart a systemd unit directly, which
      # bypasses the platform entirely — so before this step webface.cloud had
      # NO record that the app had ever been deployed: the events feed showed
      # nothing and the apps table's "last deployed" column stayed blank (book)
      # or two weeks stale (fitbase). The endpoint exists precisely for external
      # CI (see web/api.go apiLogEvent); nothing was calling it.
      #
      # Non-fatal on purpose: a reporting failure must never fail, or roll back,
      # an otherwise healthy deploy. If WFC_API_TOKEN is unset this is a no-op.
      - name: Report deploy to webface.cloud
        if: success()
        env:
          WFC_API_TOKEN: ${{ secrets.WFC_API_TOKEN }}
          WFC_APP_ID: ud7mn51oaq0u0h6
        run: |
          if [ -z "$WFC_API_TOKEN" ]; then
            echo "WFC_API_TOKEN not set — skipping deploy report (add it in repo secrets)"
            exit 0
          fi
          code=$(curl -s -o /tmp/wfc_report.txt -w '%{http_code}' --max-time 20 \
            -X POST "https://webface.cloud/api/platform/apps/$WFC_APP_ID/events" \
            -H "Authorization: Bearer $WFC_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"git_deploy_ok\",\"message\":\"fitbase deployed from CI ($GITHUB_SHA)\"}") || true
          echo "report HTTP $code"; cat /tmp/wfc_report.txt 2>/dev/null || true
          [ "$code" = "201" ] || echo "deploy report failed (non-fatal)"
